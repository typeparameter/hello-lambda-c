name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - run: nix fmt -- --ci

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make install PREFIX="$RUNNER_TEMP/prefix"
      - run: cmake -S examples/hello -B "$RUNNER_TEMP/hello" && cmake --build "$RUNNER_TEMP/hello"
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/prefix/lib/pkgconfig

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - run: nix flake check
